spring:
  datasource:
    url: jdbc:h2:mem:jwtmvc;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate.ddl-auto: create-drop
security:
  jwt:
    private-key-path: classpath:keys/test-private.pem
    public-key-path: classpath:keys/test-public.pem
    issuer: jwt-mvc-test
    expiration-seconds: 900
